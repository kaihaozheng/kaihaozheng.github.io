   Scrolling on, or clicking anything, leads to the parts below. The trip is a page of its own: clicking the globe,

  --mono:"Libre Franklin",Arial,"PingFang SC",sans-serif;

.hls{display:flex;flex-wrap:wrap;gap:.25rem .35rem;padding-top:.4rem}

/* everything at Peking University sits in one drawn bracket; the seal is the only red */
.pku{position:relative;margin-top:.55rem;padding-left:1.05rem}
.pku::before{content:"";position:absolute;left:0;top:1.2rem;bottom:.7rem;width:.5rem;border:1px solid var(--ink);border-right:0;border-radius:.35rem 0 0 .35rem}

/* the stickers: each cut differently */

.s-phd{width:5.2rem;padding:.42rem .25rem .38rem;background:var(--water);color:var(--sheet);border:2px solid var(--sheet);outline:1px solid var(--water);transform:rotate(-4deg)}

.s-phd i{display:block;font-style:normal;font-size:.56rem;letter-spacing:.1em;padding-top:.2rem}
.s-msc{width:5rem;background:var(--sheet);border:1px solid var(--ink);padding:.4rem .25rem;transform:rotate(-2deg)}
.s-msc b{display:block;font-size:1.18rem;font-weight:500}
.s-msc em{display:block;font-style:normal;font-size:.56rem;line-height:1.25;letter-spacing:.06em;color:var(--pencil);padding-top:.25rem}

.s-tyo .card em{display:block;font-style:normal;font-size:.56rem;letter-spacing:.1em;color:var(--pencil);padding-top:.25rem}

/* ---------- small paper things (the page of interesting stuff) ---------- */

.receipt .face{padding:10px 10px 16px;text-align:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),92% 100%,84% calc(100% - 6px),76% 100%,68% calc(100% - 6px),60% 100%,52% calc(100% - 6px),44% 100%,36% calc(100% - 6px),28% 100%,20% calc(100% - 6px),12% 100%,4% calc(100% - 6px),0 100%);box-shadow:none}

.badge .end{padding:9px 8px 0}
.band2 .face{padding:7px 12px 7px 30px;border-radius:14px;border:1px solid var(--water)}
.band2 .face::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:1px solid var(--water)}

.stub2 .face::before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:1px dashed var(--pencil)}
.stub2 .face::after{content:"";position:absolute;left:7px;top:-7px;width:13px;height:13px;border-radius:50%;background:var(--paper)}
.typed .face{padding:9px 12px 11px}
.typed .ln{display:block;height:1px;background:var(--grid-strong);margin-top:9px}

/* ---------- one thing in hand ---------- */
.line{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .28em;font-size:var(--f-h2)}
.line .iam{font-size:1em;line-height:1.2;letter-spacing:0;color:var(--pencil)}
.line .ending{min-height:0;flex:1 1 12em;min-width:0;font-size:1em;line-height:1.2;text-wrap:wrap}
/* every “I am …” heading below the desk, and each sheet's “I am …”, in bold italic (用户 11-13) */
.line .iam,.line .ending,.sheet h3.sheettitle{font-style:italic;font-weight:700}
.nav{display:flex;gap:6px;flex:none}
.nav button,.replay{background:var(--sheet);border:1px solid var(--grid-strong);border-radius:3px;min-width:2.5rem;min-height:2.5rem;padding:0 .7rem;cursor:pointer;font:.8rem var(--mono)}
.nav button:hover,.replay:hover{border-color:var(--ink)}
.held{display:grid;grid-template-columns:minmax(0,27rem) minmax(0,1fr);gap:var(--s4);padding-top:var(--s4);align-items:start}

.held .right{display:flex;flex-direction:column;gap:var(--s4);min-width:0;max-width:54rem}
/* the two columns are as tall as the part; only the sheets in them take a click, so the globe in the corner and its tag still can */
#view .held,.held .left,.held .right{pointer-events:none}
.held .left > *,.held .right > *{pointer-events:auto}
/* beside an open page the sheet is only a way to move around, so it is drawn compact */

/* beside an open page each row is two short lines: who, at text size, and where, kept to one line */
.held .cvrow .end{font-size:var(--f-text);text-wrap:nowrap;white-space:nowrap}

.held .cvrow .sub{display:none}
.held .cvrow .stk{zoom:.82}
.held .pkuhead{padding:.5rem 0 .45rem}.held .pkuhead .logo{width:2.3rem;height:2.3rem}
.held .s-tyo{margin-top:-.3rem}
.stuffgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem 1.25rem;align-items:start;max-width:25rem}
.stuffgrid .small{cursor:pointer;opacity:.55;transition:opacity .2s,transform .3s var(--ease)}
.stuffgrid .small.on,.stuffgrid .small:hover{opacity:1}
.meanwhile{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.meanwhile .k{padding-right:4px}
.meanwhile button{display:flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--grid-strong);border-radius:16px;padding:5px 11px 5px 8px;min-height:34px;cursor:pointer;font-size:.9rem;line-height:1.2}
.meanwhile button .ic{width:1.05rem;height:1.05rem}
.meanwhile button:hover{border-color:var(--ink)}
.meanwhile button.off{opacity:.42;border-style:dashed}
.others{display:flex;flex-direction:column;max-width:35rem}
.others .k{padding-bottom:4px}
.others button{background:none;border:0;border-top:1px solid var(--grid-strong);padding:.55rem 0;text-align:left;cursor:pointer;font-size:1.06rem;line-height:1.25;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline}
.others button:last-child{border-bottom:1px solid var(--grid-strong)}
.others button i{font:.69rem var(--mono);font-style:normal;color:var(--pencil);letter-spacing:.06em}

.sheet{position:relative;background:var(--sheet);box-shadow:var(--lift-hi);padding:2.25rem 2.25rem 2.5rem;min-width:0}
.sheet::before,.sheet::after{content:"";position:absolute;top:-9px;width:5.4rem;height:1.25rem;background:var(--tape)}
.sheet::before{left:2.25rem;transform:rotate(-3deg)}.sheet::after{right:2.25rem;transform:rotate(2.5deg)}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3)}

.facts{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:.75rem var(--s3);margin:0;align-items:baseline}

/* looking back: not another row of facts but an index card taped on afterwards, lined up with the facts column (用户 11-13: 再构思一下怎么展示) */
/* the card and the photos of the same years side by side (用户 11-13: 和照片并列放) */
.recall{display:grid;grid-template-columns:minmax(15rem,21rem) minmax(0,1fr);gap:var(--s4);align-items:start}
@media (max-width:1279px){.recall{grid-template-columns:minmax(0,1fr);gap:var(--s3)}.recall .lookback{max-width:30rem}}
.lookback{position:relative;max-width:none;margin:var(--s2) 0 0;padding:1rem 1.3rem 1.1rem;
  background:var(--sheet);box-shadow:var(--lift);transform:rotate(-.6deg)}
.lookback .tape{position:absolute;width:3.6rem;height:1rem;background:var(--tape);left:1.2rem;top:-.5rem;transform:rotate(-4deg)}
.lookback .k{display:block;font:var(--lab)/1.6 var(--mono);letter-spacing:var(--lab-sp);text-transform:uppercase;color:var(--pencil);
  padding-bottom:.3rem;border-bottom:1px solid var(--amber);margin-bottom:.2rem}
/* the card's ruling: one line under each line of writing */
.lookback p{margin:0;font-size:var(--f-text);line-height:1.75rem;
  background:repeating-linear-gradient(transparent 0 calc(1.75rem - 1px),var(--bg-bold) calc(1.75rem - 1px) 1.75rem)}
.facts a{color:inherit;text-decoration-color:var(--amber);text-decoration-thickness:1px;text-underline-offset:3px}
.facts ul{margin:0;padding-left:1.1em}.facts li + li{margin-top:4px}
.pubs{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3);max-width:44em}
.pubs li{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:.2rem var(--s3);align-items:baseline}

.pubs .ci b{font-weight:500}
/* a second paper of the same project: a full rule between the two (用户 11-13) */
.pubs .then{display:block;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--pencil)}
.pubs .ou{display:block;font-size:var(--f-small);line-height:1.5;color:var(--pencil);padding-top:.2rem}
.pubs .ou.last{padding-top:var(--s2)}   /* one line for the whole project, under both papers */
.morelab span{color:var(--pencil)}   /* the way on from the letter (用户 11-13) */
.plain{margin:0;padding-left:1.1em;max-width:40em}.plain li + li{margin-top:3px}
.jump{display:inline;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:var(--f-text);line-height:1.4;
  text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:1.5px;text-underline-offset:5px}

.letter{max-width:34em;font-size:var(--f-title);line-height:1.5;text-wrap:pretty}

.taped{position:relative;margin:0;background:var(--sheet);padding:8px 8px 10px;box-shadow:var(--lift);max-width:27rem;transform:rotate(-.5deg)}

.taped .empty{display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border:1px dashed var(--pencil);text-align:center;padding:16px;font-family:var(--hand);color:var(--pencil)}
.taped figcaption{font:var(--f-meta)/1.45 var(--mono);padding:8px 4px 0}

/* ---------- the trip ---------- */
.trav{display:flex;flex-direction:column;gap:1.5rem;padding-top:1.1rem}
.travhead{padding-top:1rem}
.travhead{display:grid;grid-template-columns:minmax(0,1fr);max-width:44rem}
.lead{font-size:var(--f-title);line-height:1.5;margin:0;max-width:34em;text-wrap:pretty}
.tfacts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem 1rem;margin:0;font-size:var(--f-text);line-height:1.4;align-items:baseline}
.tfacts dt{font:var(--lab)/1.6 var(--mono);letter-spacing:var(--lab-sp);text-transform:uppercase;color:var(--pencil)}
.tfacts dd{margin:0}
.mapwrap{position:relative;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.mapbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem 1.4rem}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem}
.legend label{display:flex;align-items:center;gap:.45rem;cursor:pointer;font-size:.97rem;line-height:1.3}
.legend input{width:1rem;height:1rem;accent-color:var(--amber);flex:none;margin:0}
.legend .key{flex:none;width:.8rem;height:.8rem;border-radius:50%}
.key.t{background:var(--amber)}.key.b{background:var(--pencil)}.key.p{border:0;border-radius:0;width:1.3rem;height:0;border-top:2px dashed var(--pencil)}
.legend small{font:.69rem var(--mono);color:var(--pencil)}
.mapbox{position:relative;height:min(clamp(24rem,calc(100vh - 19rem),50rem),72vw);min-height:15rem;background:var(--sea);box-shadow:var(--lift-hi);overflow:hidden}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;transition:opacity .35s}
.unrolling canvas{opacity:0}
#mapA{position:relative}
.marksrow{position:absolute;z-index:2;left:.6rem;top:.6rem;display:flex;flex-wrap:wrap;gap:.3rem;max-width:calc(100% - 1.2rem)}
.mapctl{position:absolute;z-index:2;right:.6rem;top:.6rem;display:flex;gap:.3rem}
.marksrow button,.mapctl button{background:var(--sheet);border:1px solid var(--grid-strong);border-radius:3px;min-width:2.25rem;min-height:2.25rem;padding:0 .6rem;cursor:pointer;font:.78rem var(--mono)}
.marksrow button:hover,.mapctl button:hover{border-color:var(--ink)}
.marksrow button{display:inline-flex;align-items:center;gap:.45rem}
.marksrow button i{font-style:normal;font-size:.68rem;color:var(--pencil)}
.marksrow .lamp{width:.5rem;height:.5rem;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px rgba(178,112,30,.18)}
.marksrow button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.marksrow button[aria-pressed="true"] i{color:var(--sheet);opacity:.7}
.marksrow button.off{cursor:default;color:var(--pencil);background:rgba(250,250,247,.72);border-style:dashed}
.marksrow button.off:hover{border-color:var(--grid-strong)}
.marksrow button.off .lamp{background:transparent;box-shadow:none;border:1px solid var(--pencil)}
/* the controls wait for the map: they come in one after another once it has unrolled */
.mapwrap .legend,.marksrow > *,.mapctl,.routes,.scrub{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.mapwrap.pre .legend,.mapwrap.pre .marksrow > *,.mapwrap.pre .mapctl,.mapwrap.pre .scrub{opacity:0;transform:translateY(-.35rem);pointer-events:none}
.mapwrap.pre .routes{opacity:0;transform:translateX(-1rem);pointer-events:none}
.marksrow > :nth-child(2){transition-delay:.05s}.marksrow > :nth-child(3){transition-delay:.1s}.marksrow > :nth-child(4){transition-delay:.15s}.marksrow > :nth-child(5){transition-delay:.2s}.marksrow > :nth-child(6){transition-delay:.25s}
.mapwrap:not(.pre) .mapctl{transition-delay:.15s}.mapwrap:not(.pre) .routes{transition-delay:.25s,.25s,0s}.mapwrap:not(.pre) .scrub{transition-delay:.35s}
.mapwrap.pre .marksrow > *,.mapwrap.pre .mapctl,.mapwrap.pre .routes,.mapwrap.pre .scrub{transition-delay:0s}
/* the map keeps to Arial alone, like the words drawn on it (用户 11-13) */
.mapwrap,.tip{--serif:var(--mono)}
.tip{position:fixed;z-index:25;pointer-events:none;background:var(--ink);color:var(--sheet);font:.75rem/1.4 var(--mono);padding:5px 8px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-125%)}

.placecard{position:absolute;z-index:4;right:.75rem;top:3.4rem;width:19rem;max-width:calc(100% - 1.5rem);max-height:calc(100% - 6.4rem);overflow:auto;background:var(--sheet);box-shadow:var(--lift-hi);padding:1rem 1rem .9rem}
.placecard.float{position:fixed;z-index:20;top:auto;bottom:1rem;right:1rem;max-height:70vh}
.placecard .x{position:absolute;right:6px;top:6px;background:none;border:0;min-width:36px;min-height:36px;cursor:pointer;font:1rem var(--mono);color:var(--pencil)}
.placecard h4{font:400 1.4rem/1.15 var(--serif);margin:0 30px 2px 0}
.placecard .when{font:.72rem/1.5 var(--mono);color:var(--amber);margin:0 0 10px}
.placecard .img{display:grid;place-items:center;aspect-ratio:3/2;border:1px dashed var(--pencil);background:var(--paper);margin-bottom:10px;font-family:var(--hand);color:var(--pencil)}
.placecard img.img{display:block;width:100%;object-fit:cover;border:0}
.placecard .nd{font:.66rem/1.4 var(--mono);color:var(--pencil);margin:0 0 4px}

.placecard .one{font-size:var(--f-text);line-height:1.45;margin:10px 0 12px}
.placecard .enl{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;text-align:left;font:inherit;color:inherit}
.placecard .one .enl{display:inline}
.placecard .enl:hover img{filter:brightness(1.05)}.placecard .one .enl:hover{color:var(--amber)}
#lightbox{position:fixed;inset:0;z-index:80;background:rgba(27,42,65,.92);display:grid;place-items:center;
  padding:max(3.5rem,env(safe-area-inset-top,0px)) max(1.5rem,env(safe-area-inset-right,0px)) max(1.5rem,env(safe-area-inset-bottom,0px)) max(1.5rem,env(safe-area-inset-left,0px))}
body.lbopen{overflow:hidden}

.placecard .walk{display:flex;gap:6px;border-top:1px solid var(--grid-strong);padding-top:10px}

      '<div class="travhead"><p class="lead">I’m a slow doer. From the start, before my master’s even began, I knew I had something for earth science, and I knew I was going to prepare myself, in knowledge and beyond. So I’m currently on a trip I’ve been planning for three years. At 25, I’m trying to travel around the world, across as many basins as possible.</p>'+
      '</div>'+
      tmodsHTML()+
      '</div></section>';
  }

  /* ---------- notes to the reader of this prototype: numbered, so you can answer by number ---------- */
  var NOTES=[
    [1,'名字后面的那一行每 3 秒换一条身份；换到 research 时右边的 Research 卡片亮。',''],
    [2,'人像还是灰色的人形贴纸占位，五个部分各一张，等你的照片。',''],
    [3,'CV 单子：课题组名字改成了 GeoWater。点一行会滑到下面对应的那一张。',''],
    [4,'Research 卡片：四篇论文的出处缩成了一行，给登机牌让地方。',''],
    [5,'登机牌现在大部分露在外面，只有右下一角压在地球后面。','露出的多少合适了吗？'],
    [7,'More about me 不再是盒子和单独的一部分：收成名字下面的四个小标签，鼠标指上去，名字后面那一行会换成对应的那句。',''],
    [8,'Travels 不再是往下滑出来的一部分，而是单独的一页：点地球、登机牌、顶上的 Travels 标签、滑到 Research 后面那一行里的 “Open the map”，或者地球旁边一直跟着的小牌子，都会进去；展开动画只在点进去时放一次。从那一页点 “Back to where I was” 回到原来滑到的位置。','这样进出顺手吗？小牌子会不会碍事？'],
    [9,'硕士、东大、本科三张单子里各加了一排小照片位，放你在课题组、在东京、在课堂以外做的事；照片横着滑，写多少件单子都不会变长。奖项收成了一行，点开才展开。','这种“一排小照片”的放法对吗？'],
    [10,'路线板块：每一段下面写了起点 → 终点；点一段，地图上起点和终点会标 START、END。飞的航段画成灰色虚线，不属于任何一段，点一段时地图也不把它算进视野。','哪些航段是飞的，我除了你说的四趟还猜了三趟（内容文档“飞的航段”那张表），对吗？'],
    [11,'点城市以后关不掉卡片的问题：卡片被排在后面的内容压住了，已经修好；按 Esc 也能关。',''],
    ['–','现在页面读的是你电脑上的文件：每一站的文字在 Assets/3-Travels/Notes/ 里（一站一个小节），每个地方的照片放 Assets/3-Travels/Photos/地名/，课题组、东京、本科的照片放 Assets/2-Photos/ 下面对应的文件夹，文件名就是照片下面那句话。你放的两张答辩照片已经在硕士那张单子上。',''],
    ['–','页面和打包脚本现在在 Assets/4-Webpage/ 里。改完文件以后双击 Assets 文件夹里的 Build-Preview.command，会重新打包并打开本地的页面。',''],
    ['–','地点、日期、标签仍是 11-05 整理的，没有核对。','']
  ];
  var notesEl=document.getElementById('notes'),notesBtn=document.getElementById('notesbtn'),tabsEl=document.getElementById('tabs');
  function setNoting(on){
    S.noting=on;document.body.classList.toggle('noting',on);notesBtn.setAttribute('aria-pressed',String(on));notesEl.hidden=!on;
    if(on)notesEl.innerHTML='<h2>批注 · 可以按编号回我，比如“5 露太少”“7 对”</h2><ol>'+NOTES.map(function(n){return '<li><b>'+n[0]+'</b><span>'+n[1]+(n[2]?'<q>问：'+n[2]+'</q>':'')+'</span></li>'}).join('')+'</ol>'+
      '<p>红框“示例”是我写的句子，虚框“待填”是还没有材料的地方；关掉批注它们就不显示。</p>';
  }
  notesBtn.addEventListener('click',function(){setNoting(!S.noting)});
  /* the notes button is gone (用户 11-13: “右上角有一个批注，请你把这个东西去掉”); the blanks it showed stay hidden */
  notesBtn.hidden=true;

  /* ---------- moving around: the tabs, a click on anything, or just scrolling ---------- */
  function tabOf(sec){return sec==='door'?'travels':sec}
  function goSec(id,sheet){
    if(id==='travels'){openTravel();return}
    var was=S.trav;if(was)closeTravel(true);
    var how=reduced||was?'auto':'smooth';
    if(id==='about'){window.scrollTo({top:0,behavior:how});return}
    var el=document.getElementById(sheet?'sheet-'+sheet:id);if(el)el.scrollIntoView({behavior:how,block:'start'});
  }
  /* the trip is a page of its own: opened by a click, never by scrolling, so the globe unrolls once and only when asked */
  function openTravel(){
    if(S.trav)return;var st=reduced?null:GLOBE.state();if(st&&!st.vis)st=null;
    S.back=window.scrollY;S.trav=true;document.body.classList.add('travel');document.getElementById('travels').hidden=false;window.scrollTo(0,0);
    var mw=document.querySelector('.mapwrap');if(mw)mw.classList.add('pre');
    if(!S.mapReady){MAP.init();S.mapReady=true}else MAP.setMode();
    MAP.detail();
    var prev=S.sec;S.sec='travels';S.sheet='';onSec(prev);
    if(st){GLOBE.hide();requestAnimationFrame(function(){UNROLL.play(st,MAP.reveal)})}else setTimeout(MAP.reveal,120);
  }
  function closeTravel(stay){
    if(!S.trav)return;S.trav=false;MAP.close();document.body.classList.remove('travel');document.getElementById('travels').hidden=true;
    if(!stay)window.scrollTo(0,S.back||0);
    S.sec='';spy();
  }
  /* below the desk the globe sits in a corner; when a heading or a line of links that lies straight on the squared
     paper is crossing that corner, the globe and its tag fade out instead of running through the words */
  var SHYSEL='.sechead > .k,.sechead .iam,.sechead .ending,.sechead .goback,.ihead > *,.wwh .q,.wwh h4,.wwh p,.doorrow > *,.colophon';
  function shy(){
    var on=false,g=GLOBE.target(),vh=window.innerHeight,rg=document.createRange();
    if(g&&wide()&&!S.trav&&S.sec==='research')on=true;   /* nothing in the research part is pinned to the globe, and its wide sheet would leave only a sliver showing */
    else if(g&&wide()&&!S.trav&&S.sec!=='about'){
      var els=view.querySelectorAll(SHYSEL);
      for(var i=0;i<els.length&&!on;i++){
        var b=els[i].getBoundingClientRect();if(!b.width||b.bottom<g[1]-g[2]||b.top>vh)continue;
        rg.selectNodeContents(els[i]);var r=rg.getBoundingClientRect();if(!r.width)r=b;
        var dx=g[0]-Math.max(r.left,Math.min(g[0],r.right)),dy=g[1]-Math.max(r.top,Math.min(g[1],r.bottom)),R=g[2]+14;
        on=dx*dx+dy*dy<R*R;
      }
    }
    document.body.classList.toggle('shy',on);
  }
  function onSec(prev){
    document.body.dataset.view=S.sec;
    Array.prototype.forEach.call(tabsEl.querySelectorAll('[data-go]'),function(b){b.setAttribute('aria-current',String(b.dataset.go===tabOf(S.sec)))});
    Array.prototype.forEach.call(view.querySelectorAll('.held .cvrow'),function(b){b.classList.toggle('on',b.dataset.sheet===S.sheet)});
    GLOBE.aim();shy();
    try{history.replaceState(null,'',location.pathname+location.search+(S.sec==='about'||S.sec==='door'?'':'#'+S.sec))}catch(e){}
  }
  function spy(){
    if(S.trav)return;
    var y=window.innerHeight*.4,sec='about',sheet='';
    SECS.forEach(function(id){var el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<=y)sec=id});
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4&&window.scrollY>200)sec='door';
    if(sec==='education'){sheet=ACADEMIC[0];ACADEMIC.forEach(function(id){var el=document.getElementById('sheet-'+id);if(el&&el.getBoundingClientRect().top<=Math.min(y,190))sheet=id})}
    var prev=S.sec,ch=sec!==S.sec||sheet!==S.sheet;S.sec=sec;S.sheet=sheet;if(ch)onSec(prev);
    S.scrolled=window.scrollY>60;shy();
    if(sec!=='about'||wide())return;
    /* on a narrow screen, the row you have scrolled to is the one that lights up */
    if(!S.scrolled){if(S.hover){S.hover='';light(S.auto);GLOBE.aim()}return}
    var best='',bd=1e9;
    Array.prototype.forEach.call(view.querySelectorAll('#about .cvrow,#about .pass,#about .rcard'),function(el){
      var r=el.getBoundingClientRect(),d=Math.abs((r.top+r.bottom)/2-y);if(d<bd){bd=d;best=el.dataset.paper}});
    if(best!==S.hover){S.hover=best;light(best);GLOBE.aim()}
  }
  function render(){
    view.innerHTML=deskHTML()+researchHTML()+eduHTML()+doorHTML()+travelHTML();
    light(S.auto);GLOBE.aim();
    /* v5.1: the figures that only slide out on pointing load after the page has (the first-screen one is already in) */
    (function later(){function go(){Array.prototype.forEach.call(document.querySelectorAll('img[data-src]'),function(i){i.src=i.dataset.src;i.removeAttribute('data-src')})}
      if(document.readyState==='complete')setTimeout(go,300);else window.addEventListener('load',function(){setTimeout(go,300)},{once:true})})();
    /* 02D: each sheet keeps its first block; the rest goes into a drawer that slides open */
    Array.prototype.forEach.call(view.querySelectorAll('#education .sheet .sheet-body'),function(b){
      var kids=Array.prototype.slice.call(b.children,1);if(!kids.length)return;var r=document.createElement('div');r.className='rest';
      var inner=document.createElement('div');kids.forEach(function(k){inner.appendChild(k)});r.appendChild(inner);b.appendChild(r)});
  }

  document.addEventListener('click',function(e){
    if(e.target.closest('a[href]'))return;   /* a link inside a row goes where it says */
    var el=e.target.closest('[data-flip],[data-place],[data-card-close],[data-zoom],button[data-view],[data-cont],[data-routes],[data-seg],[data-tabs],[data-back],[data-sheet],[data-go]');if(!el)return;   /* button[data-view]: <body data-view> says which page is showing; without “button” any click on the trip page (the photo, the card) put the map back to the whole world (用户 11-16) */
    var d=el.dataset;
    if(d.place!==undefined){MAP.select(+d.place);var mb=document.getElementById('mapbox');if(mb&&window.innerWidth<1180)mb.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});return}
    if(d.cardClose!==undefined){MAP.close();return}
    if(d.zoom){MAP.zoomBy(+d.zoom);return}
    if(d.view){MAP.view(d.view);return}
    if(d.cont){MAP.cont(d.cont);return}
    if(d.routes!==undefined){MAP.toggleRoutes();return}
    if(d.seg!==undefined){MAP.segment(d.seg);var mb2=document.getElementById('mapbox');if(mb2&&el.closest('.plist'))mb2.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});return}
    if(d.flip!==undefined){var on=!el.classList.contains('on');el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on));return}
    if(d.back!==undefined){closeTravel();return}
    if(d.tabs!==undefined){tabsEl.classList.toggle('open');return}
    if(d.sheet==='phd'){var cvt=document.querySelector('.tocv');if(cvt)cvt.click();return}   /* the letter lives on the Interactive CV now (user 11-15) */
    if(d.sheet){var sh=document.getElementById('sheet-'+d.sheet);if(sh)sh.classList.remove('folded');goSec('education',d.sheet);return}
    if(d.go){
      tabsEl.classList.remove('open');
      goSec(d.go);
    }
  });
  /* 02D: unfold a sheet; open a research-interest tile (pointing on a computer, tapping on a phone) */
  function openSheet(a,only){Array.prototype.forEach.call(document.querySelectorAll('#education .sheet'),function(x){if(x===a)x.classList.remove('folded');else if(only)x.classList.add('folded')})}
  if(window.matchMedia&&window.matchMedia('(hover: hover)').matches)document.addEventListener('mouseover',function(e){var a=e.target.closest&&e.target.closest('#education .sheet.folded');if(a)openSheet(a,true)});
  document.addEventListener('click',function(e){var u=e.target.closest('[data-unfold]')||(e.target.closest('a,button')?null:e.target.closest('#education .sheet.folded'));if(u){var a=u.closest('.sheet');if(a.classList.contains('folded'))openSheet(a,true);else a.classList.add('folded');return}
    var w=e.target.closest('[data-wwh]');if(w){Array.prototype.forEach.call(w.parentNode.children,function(x){x.classList.toggle('on',x===w)})}});
  if(window.matchMedia&&window.matchMedia('(hover: hover)').matches)document.addEventListener('mouseover',function(e){var w=e.target.closest&&e.target.closest('[data-wwh]');if(w&&!w.classList.contains('on'))Array.prototype.forEach.call(w.parentNode.children,function(x){x.classList.toggle('on',x===w)})});
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click();return}
    if(e.key!=='Escape')return;tabsEl.classList.remove('open');var pc=document.getElementById('placecard');
    if(S.noting)setNoting(false);else if(S.trav&&pc&&!pc.hidden)MAP.close();else if(S.trav)closeTravel();
  });
  document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.layer)MAP.layer(t.dataset.layer,t.checked)});
  document.addEventListener('input',function(e){if(e.target.id==='scrub')MAP.scrub(+e.target.value)});
  /* pointing at something on the desk holds the line on it; otherwise the line moves on by itself */
  ['mouseover','focusin'].forEach(function(ev){view.addEventListener(ev,function(e){
    if(S.sec!=='about')return;var b=e.target.closest('#about [data-paper]');if(!b||S.hover===b.dataset.paper)return;
    S.hover=b.dataset.paper;show(S.hover);
  })});
  ['mouseout','focusout'].forEach(function(ev){view.addEventListener(ev,function(e){
    if(S.sec!=='about'||!S.hover)return;var to=e.relatedTarget;if(to&&to.closest&&to.closest('#about [data-paper]'))return;
    S.hover='';show(S.auto);
  })});
  if(!reduced)setInterval(function(){
    if(S.sec!=='about'||S.hover||S.scrolled||document.hidden)return;
    S.rot=(S.rot+1)%ROT.length;S.auto=ROT[S.rot];show(S.auto);
  },3200);
  var ticking=false;
  window.addEventListener('scroll',function(){if(ticking)return;ticking=true;requestAnimationFrame(function(){ticking=false;spy()})},{passive:true});
  window.addEventListener('resize',function(){GLOBE.aim();spy();shy()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){GLOBE.aim();if(S.trav)MAP.setMode()});

  render();
  if(document.fonts&&document.fonts.load)Promise.all(['11px ','13px ','bold 13px '].map(function(w){return document.fonts.load(w+MAPF)})).then(function(){GLOBE.aim();if(S.trav)MAP.setMode()},function(){});
  var h0=(location.hash||'').slice(1);
  if(SECS.indexOf(h0)>0){var e0=document.getElementById(h0);if(e0)e0.scrollIntoView()}
  spy();onSec(S.sec);
  if(h0==='travels')openTravel();
  if(window.requestIdleCallback)requestIdleCallback(function(){MAP.preload()},{timeout:4000});else setTimeout(function(){MAP.preload()},2500);
})();
</script>
